services:
  - type: web
    name: fileforge-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        value: https://fileforge-client.vercel.app,http://localhost:5173
      - key: MAX_FILE_SIZE_MB
        value: "100"
      - key: CONVERSION_CONCURRENCY
        value: "1"
      - key: FFMPEG_THREADS
        value: "1"
      - key: SHARP_CONCURRENCY
        value: "1"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: SIMPLE_ENGLISH_MAX_INPUT_CHARS
        value: "50000"
      - key: SIMPLE_ENGLISH_MAX_OUTPUT_TOKENS
        value: "6000"
      - key: ONLYOFFICE_URL
        sync: false
      - key: ONLYOFFICE_INTERNAL_URL
        sync: false
      - key: ONLYOFFICE_JWT_SECRET
        sync: false
