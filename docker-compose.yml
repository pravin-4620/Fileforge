services:
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: fileforge-onlyoffice
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Set ONLYOFFICE_JWT_SECRET in your environment}
      ALLOW_PRIVATE_IP_ADDRESS: "true"
